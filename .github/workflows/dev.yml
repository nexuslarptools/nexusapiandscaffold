on:
  push:
    branches:
      - 'development'

name: dev build
permissions:
  contents: write
  id-token: write
jobs:
  publish-nexus-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_GH_CID }}
          oauth-secret: ${{ secrets.TS_GH_CSEC }}
          tags: tag:ci

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Change Tag
        run: |
          echo "GIT_TAG=$(echo "${{ github.ref_name }}" | sed -e 's/+/-/g')" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build container image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: kbrighton/nexuslarp:latest
          file: Dockerfile
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            TAG=${{ github.ref_name }}
            
      - name: Trigger Portainer Webhook
        run: curl -k -X POST ${{ secrets.PORTAINER_WEBHOOK }}

